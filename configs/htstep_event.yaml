output_folder: ./ckpt
init_rand_seed: 1234567891
num_workers: 2
batch_size: 4
train_split:
- training
val_split:
- validation
dataset:
  # HT-Step annotations and caption vectors (tools/htstep_data.py build / fetch)
  json_file: ./data/htstep/annotations.json
  # InternVideo2 text vectors of the captions: the caption space, and the space of the txt_sim metric
  # and of the consensus pick
  caption_emb_file: ./data/htstep/caption_emb_iv2j.npz
  default_fps: 16
  max_seq_len: 256
  max_buffer_len_factor: 1.0
  scale_factor: 2
  regression_range:
  - - 0
    - 4
  - - 4
    - 8
  - - 8
    - 16
  - - 16
    - 32
  - - 32
    - 64
  - - 64
    - 10000
  backbone_arch:
  - 2
  - 3
  - 5
  trunc_thresh: 0.5
  crop_ratio:
  - 0.9
  - 1.0
  num_classes: 16
  force_upsampling: true
  # input features: InternVideo2 + BEATs from tools/extract_internvideo2.py, one row per second.
  # The model input width is set from iv2_video_keys by train.py
  iv2_folder: ./data/htstep/iv2_feats
  iv2_video_keys: [v768]   # v768 = pooled vision, v512 = its projection into InternVideo2's text space
  iv2_l2norm: true
  center_sample_radius: 0.0  # > 0 (ActionFormer: 1.5): only points within this many strides of a step's centre are positive
  # feature augmentation of training items (StepCaptionDataset._augment), all off by default
  aug_stretch: false     # true: the crop is resampled back to max_seq_len (with crop_ratio [0.6, 1.0]: speed jitter)
  aug_modal_drop: 0.0    # probability of zeroing the audio or the visual stream
  aug_mask_spans: 0      # random spans zeroed per stream, each 1..aug_mask_width steps
  aug_mask_width: 4
  aug_noise: 0.0         # Gaussian noise std (rows are L2-normalised, 768-d: one entry ~0.036)
model:
  backbone_type: convTransformer
  backbone_arch:
  - 2
  - 3
  - 5
  scale_factor: 2
  input_dim_V: 768     # set by train.py from the features
  input_dim_A: 768
  n_head: 4
  embd_kernel_size: 3
  embd_dim: 512
  embd_with_ln: true
  head_dim: 512
  regression_range:
  - - 0
    - 4
  - - 4
    - 8
  - - 8
    - 16
  - - 16
    - 32
  - - 32
    - 64
  - - 64
    - 10000
  head_num_layers: 3
  head_kernel_size: 3
  head_with_ln: true
  use_abs_pe: true
  max_seq_len: 256
  nmax: 16
  clip_dim: 512        # set by train.py from the caption space
  text_proj: linear    # none: caption / query vectors stay frozen InternVideo2 text vectors (OV-AVEL)
  pyramid_attn: cross  # self: every backbone block attends within its own stream (OV-AVEL Table A9)
  text_stream: false   # true: the ground query is a third backbone stream next to V and A (needs loss_weight_ground > 0)
  boundary_bins: 0     # > 0: Trident boundary head (TriDet) with this many bins per side, in strides (0 = direct regression)
  train_cfg:
    loss_weight_reg: 1.0
    loss_weight_emb: 0.2
    cls_prior_prob: 0.01
    init_loss_norm: 400
    loss_weight_span: 0.2
    # ground head: a sentence finds its own span (video + text queries); 0 = no head
    loss_weight_ground: 1.0
    dropout: 0.0
    droppath: 0.1
  test_cfg:
    score_thresh: 0.05
    duration_thresh: 0.05
    max_seg_num: 100
    iou_power: 0.3
train_cfg:
  clip_grad_l2norm: 1.0
  ema_decay: 0.0       # > 0 (e.g. 0.999): evaluate and save an exponential moving average of the weights
opt:
  type: AdamW
  momentum: 0.9
  weight_decay: 0.0001
  learning_rate: 0.0001
  clip_proj_lr: 0.001
  epochs: 10
  warmup: true
  warmup_epochs: 2
  schedule_type: cosine
  schedule_steps: []
  schedule_gamma: 0.1
