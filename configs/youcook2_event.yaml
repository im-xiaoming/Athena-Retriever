output_folder: ./ckpt
init_rand_seed: 1234567891
num_workers: 2
batch_size: 4
train_split:
- training
val_split:
- validation
dataset:
  feat_folder: ./data/youcookii/av_features
  json_file: ./data/youcookii/annotations/youcookii_annotations_trainval.json
  caption_emb_file: ./data/youcookii/caption_emb.npz
  feat_stride: 8
  num_frames: 16
  default_fps: 16
  downsample_rate: 1
  max_seq_len: 256
  max_buffer_len_factor: 1.0
  scale_factor: 2
  regression_range:
  - - 0
    - 4
  - - 4
    - 8
  - - 8
    - 16
  - - 16
    - 32
  - - 32
    - 64
  - - 64
    - 10000
  backbone_arch:
  - 2
  - 3
  - 5
  class_aware: false
  trunc_thresh: 0.5
  crop_ratio:
  - 0.9
  - 1.0
  num_classes: 16
  file_prefix: null
  file_ext: .npy
  force_upsampling: true
  multi_modal: true
  # thay OmniRetriever-7B, sinh bang tools/omni_youcook2.py. Bo comment de bat
  # omni_emb_file: ./data/youcookii/omni_emb.npz
model:
  backbone_type: convTransformer
  backbone_arch:
  - 2
  - 3
  - 5
  scale_factor: 2
  input_dim_V: 1536
  input_dim_A: 1536
  n_head: 4
  embd_kernel_size: 3
  embd_dim: 512
  embd_with_ln: true
  head_dim: 512
  regression_range:
  - - 0
    - 4
  - - 4
    - 8
  - - 8
    - 16
  - - 16
    - 32
  - - 32
    - 64
  - - 64
    - 10000
  head_num_layers: 3
  head_kernel_size: 3
  head_with_ln: true
  use_abs_pe: true
  max_seq_len: 256
  nmax: 16
  clip_dim: 1536
  train_cfg:
    loss_weight_reg: 1.0
    loss_weight_emb: 0.2
    cls_prior_prob: 0.01
    init_loss_norm: 400
    loss_weight_span: 0.2
    dropout: 0.0
    droppath: 0.1
  test_cfg:
    score_thresh: 0.05
    duration_thresh: 0.05
    max_seg_num: 100
    iou_power: 0.3
train_cfg:
  clip_grad_l2norm: 1.0
opt:
  type: AdamW
  momentum: 0.9
  weight_decay: 0.0001
  learning_rate: 0.0001
  clip_proj_lr: 0.001
  epochs: 10
  warmup: true
  warmup_epochs: 2
  schedule_type: cosine
  schedule_steps: []
  schedule_gamma: 0.1
