# Smoke test: fine-tune UniAV tren YouCook2 (TAL), chi chay TASK1.
# TASK2/TASK3 phai giu lai vi libs/core/config.py:126-128 liet ke cung ca ba khe,
# nhung chung khong duoc nap khi chay --tasks 1.
# QUAN TRONG: 'epochs' cua moi task PHAI bang --num_train_epochs.
# task_ave_iter = int(epochs * len(dataloader) / num_train_epochs) (train.py:102).
# Lech nhau -> ra 0 -> moi epoch chay 0 buoc, khong bao loi.
TASK1:
  task_type: TAL
  dataset_name: anet            # dung lai libs/datasets/anet.py, dung dinh dang anet
  train_split: ['training']
  val_split: ['validation']
  test_split: ['validation']
  prompt_file: ./data/youcookii/youcookii_prompt.npy
  dataset: {
    json_file: ./data/youcookii/annotations/youcookii.json,
    feat_folder: ./data/youcookii/av_features,
    file_prefix: ,                # id YouTube tran, khong co tien to v_
    feat_stride: 8,
    num_frames: 16,
    default_fps: 16,
    trunc_thresh: 0.5,
    num_classes: 59,
    max_seq_len: 256,
    max_buffer_len_factor: 1.0,
    force_upsampling: True,
    class_aware: False,
  }
  train_cfg: {
    loss_weight: 1,
    init_loss_norm: 400,
    label_smoothing: 0.1,
  }
  test_cfg: {
    multiclass_nms: True,
    ext_score_file: ,
    nms_sigma: 0.75,
  }
  batch_size: 16                  # nho cho vua 12GB VRAM va chay nhanh
  learning_rate: 0.0001          # thap hon goc 10 lan vi dang fine-tune
  epochs: 40

TASK2:
  task_type: AVEL
  dataset_name: unav100
  train_split: ['train']
  val_split: ['test']
  test_split: ['test']
  prompt_file: ./data/unav100/unav100_prompt.npy
  dataset: {
    json_file: ./data/unav100/annotations/unav100_all.json,
    feat_folder: ./data/unav100/av_features,
    feat_stride: 4,
    num_frames: 16,
    default_fps: 16,
    trunc_thresh: 0.5,
    num_classes: 100,
    max_seq_len: 256,
    max_buffer_len_factor: 1.0,
    class_aware: True,
  }
  train_cfg: { loss_weight: 1, init_loss_norm: 300, label_smoothing: 0.0 }
  test_cfg: { multiclass_nms: True, ext_score_file: , nms_sigma: 0.4 }
  batch_size: 4
  learning_rate: 0.0001
  epochs: 40

TASK3:
  task_type: SED
  dataset_name: dcase
  train_split: ['validation']
  val_split: ['public_eval']
  test_split: ['public_eval']
  prompt_file: ./data/desed/dcase_prompt.npy
  dataset: {
    json_file: ./data/desed/annotations/dcase_all.json,
    feat_folder: ./data/desed/av_features,
    feat_stride: 4,
    num_frames: 16,
    default_fps: 16,
    trunc_thresh: 0.3,
    num_classes: 10,
    max_seq_len: 64,
    max_buffer_len_factor: 1.0,
    class_aware: True,
  }
  train_cfg: { loss_weight: 1, init_loss_norm: 400, label_smoothing: 0.0 }
  test_cfg: { multiclass_nms: True, ext_score_file: , nms_sigma: 0.4 }
  batch_size: 4
  learning_rate: 0.0001
  epochs: 40
